<svg xmlns="http://www.w3.org/2000/svg" width="560" height="386" viewBox="0 0 560 386" role="img" aria-labelledby="t d">
  <title id="t">Karta InPost na panelu Home Assistant</title>
  <desc id="d">Cztery liczniki paczek i lista trzech przesyłek: do odbioru w paczkomacie GRM02A z terminem, w drodze oraz odebrana.</desc>
  <style>
