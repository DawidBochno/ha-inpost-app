  </style>

  <rect width="560" height="386" rx="14" fill="#111111"/>
  <rect x="16" y="16" width="528" height="354" rx="12" fill="#1c1c1c"/>

  <text class="h" x="40" y="54">InPost</text>

  <g transform="translate(40,84)">
